name: Patch NRO version

# Moi khi up file SWITCH-VIET-HOA-STORE-v<so>.nro len thu muc goc,
# tu dong ghi <so> vao thong tin phien ban ben trong file de hbmenu hien dung.
on:
  push:
    branches: [main]
    paths:
      - "SWITCH-VIET-HOA-STORE*.nro"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ghi so phien ban vao file .nro
        run: |
          python3 - <<'PY'
          import glob, re, struct

          changed = False
          for path in glob.glob("SWITCH-VIET-HOA-STORE*.nro"):
              m = re.search(r"-v?(\d+(?:\.\d+){0,2})\.nro$", path, re.I)
              if not m:
                  print("Bo qua (ten khong co so phien ban):", path)
                  continue
              ver = m.group(1)
              with open(path, "r+b") as f:
                  d = f.read(0x20)
                  if d[0x10:0x14] != b"NRO0":
                      print("Khong phai NRO:", path); continue
                  size = struct.unpack_from("<I", d, 0x18)[0]
                  f.seek(size)
                  aset = f.read(0x38)
                  if aset[:4] != b"ASET":
                      print("Khong co ASET:", path); continue
                  nacp_off, nacp_size = struct.unpack_from("<QQ", aset, 0x18)
                  if nacp_size < 0x3070:
                      print("NACP qua nho:", path); continue
                  pos = size + nacp_off + 0x3060
                  f.seek(pos)
                  cur = f.read(16).split(b"\0")[0].decode(errors="ignore")
                  if cur == ver:
                      print(path, "da dung so", ver); continue
                  f.seek(pos)
                  f.write(ver.encode().ljust(16, b"\0")[:16])
                  print(path, ":", cur, "->", ver)
                  changed = True
          open("/tmp/changed", "w").write("1" if changed else "0")
          PY

      - name: Commit neu co thay doi
        run: |
          if [ "$(cat /tmp/changed)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Tu dong ghi so phien ban vao file .nro [skip ci]"
            git push
          fi
